services:
  app-front:
    build:
      context: ./frontend
      target: ${NODE_ENV}
    image: app-front
    environment:
      - NODE_ENV=production
    depends_on:
      - app-back

  app-back:
    build:
      context: ./backend
      target: ${NODE_ENV}
    image: app-back
    environment:
      - NODE_ENV=production
    depends_on:
      - db

  adminer:
    image: adminer
    restart: always
  db:
    image: postgres:18
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
